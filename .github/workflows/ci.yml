name: Validasi katalog nasional dan API
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate authoritative Git CSV
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build SQLite, JSON, CSV and checksums
        run: python scripts/build_release.py
      - name: Publish multi-format artifacts
        uses: actions/upload-artifact@v4
        with:
          name: registri-pekerjaan-indonesia-multiplatform
          path: |
            dist/pekerjaan-indonesia.sqlite3
            dist/occupations.json
            dist/occupations.csv
            dist/pekerjaan.csv
            dist/pekerjaan.json
            dist/manifest.json
            dist/jabatan_nasional.*
            dist/wilayah_administratif.*
            dist/upah_minimum.*
            dist/statistik_upah.*
            dist/kompetensi_jabatan.*
            dist/kelas_gaji.*
            dist/pemetaan_jabatan_kbji.*
            dist/pemetaan_internasional.*
